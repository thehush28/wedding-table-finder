<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Catherine & EJ Wedding</title>

  <style>

    body {
      margin: 0;
      padding: 0;
      background: #f7f4ef;
      font-family: Arial, sans-serif;
      color: #333;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .logo {
      width: 120px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      color: #666;
    }

    input {
      width: 90%;
      padding: 15px;
      margin-top: 25px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 18px;
      outline: none;
    }

    #result {
      margin-top: 30px;
    }

    .guest-card {
      background: #fafafa;
      padding: 20px;
      margin-top: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .guest-name {
      font-size: 24px;
      font-weight: bold;
    }

    .table-name {
      font-size: 30px;
      margin-top: 12px;
      color: #b68b3c;
      font-weight: bold;
    }

    .not-found {
      margin-top: 25px;
      font-size: 22px;
      color: red;
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- LOGO -->
    <img src="./logo.png?v=2" class="logo" alt="Wedding logo">

    <h1>Welcome to Catherine & EJ's Wedding</h1>

    <p>Please enter your surname or full name</p>

    <input
      type="text"
      id="guestInput"
      placeholder="Search your name..."
      onkeyup="findGuest()"
    >

    <div id="result"></div>

  </div>

  <script>

    const guests = [

      { name: "Merilyn York", table: "High O" },
      { name: "Adrian York", table: "High O" },
      { name: "London York", table: "High O" },
      { name: "Vienna York", table: "High O" },

      { name: "John Smith", table: "Table 2" },
      { name: "Sarah Smith", table: "Table 2" }

    ];

    function findGuest() {

      const input =
        document.getElementById("guestInput")
        .value
        .toLowerCase()
        .trim();

      const result =
        document.getElementById("result");

      if (input === "") {
        result.innerHTML = "";
        return;
      }

      const matches = guests.filter(g =>
        g.name.toLowerCase().includes(input)
      );

      if (matches.length > 0) {

        result.innerHTML = "";

        matches.forEach(guest => {

          result.innerHTML += `
            <div class="guest-card">

              <div class="guest-name">
                ${guest.name}
              </div>

              <div class="table-name">
                ${guest.table}
              </div>

            </div>
          `;
        });

      } else {

        result.innerHTML =
          `<div class="not-found">
            Guest not found
          </div>`;
      }
    }

  </script>

</body>
</html>
