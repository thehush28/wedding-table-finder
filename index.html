    function findGuest() {

      const input =
        document.getElementById("guestInput")
        .value
        .toLowerCase()
        .trim();

      const result =
        document.getElementById("result");

      if (input === "") {
        result.innerHTML = "";
        return;
      }

      const matches = guests.filter(g =>
        g.name.toLowerCase().includes(input)
      );

      if (matches.length > 0) {

        result.innerHTML = "";

        matches.forEach(guest => {

          result.innerHTML += `
            <div class="guest-card">

              <div class="guest-name">
                ${guest.name}
              </div>

              <div class="table-name">
                ${guest.table}
              </div>

            </div>
          `;
        });

      } else {

        result.innerHTML =
          `<div class="not-found">
            Guest not found
          </div>`;
      }
    }
