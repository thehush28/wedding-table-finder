<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Catherine & EJ Wedding</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f8f5f2;
      text-align: center;
      padding: 40px;
      color: #333;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    input {
      width: 90%;
      padding: 14px;
      font-size: 18px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-top: 20px;
    }

    #result {
      margin-top: 30px;
      font-size: 22px;
    }

  </style>
</head>

<body>

  <img src="logo.png"
       style="
         width:120px;
         margin-bottom:20px;
       ">

  <div class="container">

    <h1>Welcome to Catherine & EJ's Wedding</h1>

    <p>Please enter your surname or full name</p>

    <input
      type="text"
      id="guestInput"
      placeholder="Enter your name"
      onkeyup="findGuest()"
    >

    <div id="result"></div>

  </div>

  <script>

    const guests = [

      { name: "Merilyn York", table: "High O" },
      { name: "Adrian York", table: "High O" },
      { name: "London York", table: "High O" },
      { name: "Vienna York", table: "High O" },

      { name: "John Smith", table: "Table 2" },
      { name: "Sarah Smith", table: "Table 2" }

    ];

    function findGuest() {

      const input =
        document.getElementById("guestInput")
        .value
        .toLowerCase()
        .trim();

      const result =
        document.getElementById("result");

      if (input === "") {
        result.innerHTML = "";
        return;
      }

      const matches = guests.filter(g =>
        g.name.toLowerCase().includes(input)
      );

      if (matches.length > 0) {

        result.innerHTML = "";

        matches.forEach(guest => {

          result.innerHTML += `
            <div style="
              margin-top:20px;
              padding:15px;
              background:#fafafa;
              border-radius:10px;
            ">

              <strong style="font-size:24px;">
                ${guest.name}
              </strong>

              <br><br>

              <span style="font-size:28px;">
                ${guest.table}
              </span>

            </div>
          `;
        });

      } else {

        result.innerHTML = "Guest not found";
      }
    }

  </script>

</body>
</html>
